<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#851D24"><meta name="description" content="Nanan's Bacon Jam — homemade with love, inspired by Mom."><title>Nanan's Bacon Jam | Made with Love</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><style>
:root{--burg:#851D24;--red:#B92D32;--brown:#8B4A30;--gold:#DDA348;--ivory:#FFF4E5;--ink:#352626;--muted:#74625d;--line:#eadbca}*{box-sizing:border-box}body{margin:0;background:#fffdf9;color:var(--ink);font-family:"DM Sans",Arial,sans-serif}h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15}a{color:inherit}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.shell{max-width:1180px;margin:auto;padding:0 24px}.announcement{background:var(--burg);color:white;text-align:center;font-size:12px;letter-spacing:.07em;padding:9px}.top{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.nav{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:90px}.brand img{width:118px;height:74px;object-fit:contain}.links{display:flex;align-items:center;gap:24px}.links button,.mobile-toggle{background:none;border:0;color:var(--burg);font-weight:700}.links button.active{border-bottom:2px solid var(--gold)}.cart-pill{border:1px solid var(--line)!important;border-radius:99px;padding:11px 16px}.mobile-toggle{display:none}.hero{background:linear-gradient(125deg,#fff8ee 0%,#fff1e0 65%,#f6dfc9 100%);overflow:hidden}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;min-height:500px;align-items:center;gap:42px;padding-top:46px;padding-bottom:46px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--brown);font-weight:700}.hero h1{font-size:clamp(40px,5.3vw,70px);color:var(--burg);margin:15px 0 22px}.hero p{line-height:1.8;color:#6c5248;max-width:520px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.btn{border-radius:9px;padding:14px 22px;border:1px solid var(--red);font-weight:700;background:var(--red);color:white}.btn.alt{background:transparent;color:var(--burg);border-color:var(--burg)}.hero-art{background:radial-gradient(circle at 50% 48%,#fffefb,#eed0b5);border-radius:50% 50% 46% 46%;aspect-ratio:1/1;display:grid;place-items:center;box-shadow:0 22px 65px #8b4a3020}.hero-art img{width:85%;height:85%;object-fit:contain;filter:none}.section{padding:76px 0}.section.cream{background:var(--ivory)}.section-title{text-align:center;max-width:700px;margin:0 auto 34px}.section-title h2{font-size:clamp(30px,3.5vw,44px);color:var(--burg);margin:10px 0}.section-title p,.muted{color:var(--muted);line-height:1.75}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.product{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:white;display:flex;flex-direction:column}.product-art{height:auto;aspect-ratio:4/5;display:grid;place-items:center;background:linear-gradient(145deg,#f4e0c8,#eac2a4);font-size:68px;position:relative}.product:nth-child(2) .product-art{background:linear-gradient(145deg,#f5d6cc,#d9947d)}.product:nth-child(3) .product-art{background:linear-gradient(145deg,#eee0bd,#d5b886)}.product:nth-child(4) .product-art{background:linear-gradient(145deg,#dcc6ae,#ae8a73)}.product-art small{position:absolute;bottom:12px;font-size:11px;background:#ffffffdb;padding:5px 10px;border-radius:50px;color:#664f41}.product-body{padding:20px;display:flex;flex-direction:column;flex:1}.product h3{font-size:22px;color:var(--burg);margin:5px 0}.product p{font-size:14px;line-height:1.6;color:var(--muted)}.status{display:inline-block;border-radius:99px;background:#f9eee0;color:#8b4a30;font-size:11px;font-weight:700;padding:6px 10px;align-self:start}.product .btn{margin-top:auto;width:100%;font-size:13px}.story{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}.story-image{background:#fff0df;border-radius:22px;padding:28px;display:grid;place-items:center}.story-image img{width:100%;max-height:370px;object-fit:contain}.story h2{font-size:42px;color:var(--burg)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.step{padding:24px;border:1px solid var(--line);border-radius:16px;background:white}.step b{color:var(--red)}.step h3{color:var(--burg)}.pagehead{background:var(--ivory);padding:65px 0 50px;text-align:center}.pagehead h1{font-size:48px;color:var(--burg);margin:10px}.pagehead p{color:var(--muted)}.panel{max-width:760px;margin:auto;background:white;border:1px solid var(--line);border-radius:16px;padding:28px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}.field label{font-weight:700;font-size:13px}.field input,.field textarea,.field select{border:1px solid #d7c6b9;border-radius:8px;padding:12px;background:white;width:100%}.notice{padding:15px;border-radius:10px;background:#fff1d8;border:1px solid #e7c79d;color:#704b24;font-size:13px;line-height:1.6}.cartline{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line);padding:15px 0}.qty{display:flex;align-items:center;gap:10px}.qty button{border:1px solid var(--line);border-radius:7px;background:white;padding:5px 12px}.recipe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.recipe{background:white;border:1px solid var(--line);border-radius:14px;padding:28px}.recipe .emoji{font-size:42px}.recipe h3{color:var(--burg)}.footer{background:var(--burg);color:white;padding:45px 0}.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:30px}.footer img{background:white;border-radius:8px;width:120px;height:80px;object-fit:contain}.footer p{font-size:13px;color:#f3d7d0}.empty{text-align:center;padding:35px;color:var(--muted)}.admin{background:#faf5ef;border:1px dashed #b99982;padding:22px;border-radius:14px}.admin code{word-break:break-all}.hide{display:none!important}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.hero-grid{grid-template-columns:1fr}.hero-art{max-width:420px;margin:auto;width:100%}.story{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.mobile-toggle{display:block}.links{display:none;position:absolute;top:90px;left:0;right:0;background:white;padding:24px;flex-direction:column;align-items:stretch;border-bottom:1px solid var(--line)}.links.open{display:flex}.links button{text-align:left}.recipe-grid{grid-template-columns:1fr}}@media(max-width:520px){.shell{padding:0 18px}.grid{grid-template-columns:1fr}.hero-grid{padding-top:25px}.hero h1{font-size:41px}.section{padding:50px 0}.footer-inner{flex-direction:column;text-align:center}.pagehead h1{font-size:38px}.cartline{align-items:start;flex-direction:column}}

.hero-art img {
  mix-blend-mode: multiply;
}
</style></head><body><div class="announcement">MADE WITH LOVE. INSPIRED BY MOM. · PHASE 1 RECIPE TRIAL</div><header class="top"><nav class="shell nav"><a class="brand" href="#home" aria-label="Nanan's homepage"><img src="official-logo.jpeg" alt="Nanan's original approved logo"></a><button class="mobile-toggle" id="menu" aria-label="Toggle menu" aria-expanded="false">☰ Menu</button><div class="links" id="links"><button data-page="home">Home</button><button data-page="shop">Shop</button><button data-page="story">Our Story</button><button data-page="recipes">Recipes</button><button data-page="contact">Contact</button><button data-page="cart" class="cart-pill">Bag <span id="count">0</span></button></div></nav></header><main id="app"></main><footer class="footer"><div class="shell footer-inner"><img src="official-logo.jpeg" alt="Nanan's official logo"><div><strong>Homemade with love, inspired by Mom.</strong><p>Phase 1 recipe development · Calatagan, Batangas · Contact details coming soon</p></div><div><p>© <span id="year"></span> Nanan's Bacon Jam</p><p>Not yet accepting paid orders</p></div></div></footer><script>
const flavors=[{id:'original',name:'Original Bacon Jam',image:'Nanans_Original_4x5.jpg'},{id:'spicy',name:'Spicy Bacon Jam',image:'Nanans_Spicy_4x5.jpg'},{id:'garlic',name:'Roasted Garlic Bacon Jam',image:'Nanans_Roasted_Garlic_4x5.jpg'},{id:'coffee',name:'Batangas Barako Coffee Bacon Jam',image:'Nanans_Batangas_Barako_Coffee_4x5.jpg'}];
const app=document.getElementById('app');let cart={};let current='home';document.getElementById('year').textContent=new Date().getFullYear();
const header=(title,sub)=>`<section class="pagehead"><div class="shell"><span class="eyebrow">Nanan's Bacon Jam</span><h1>${title}</h1><p>${sub}</p></div></section>`;
const card=f=>`<article class="product"><div class="product-art"><img loading="lazy" decoding="async" src="${f.image}" alt="${f.name} jar packaging concept" style="width:100%;height:100%;object-fit:contain;display:block;"></div><div class="product-body"><span class="status">Coming Soon · Trial</span><h3>${f.name}</h3><p>Illustrative jar concept. Recipe, jar size, ingredients and pricing pending owner confirmation.</p><button class="btn alt" disabled>Not yet available</button></div></article>`;
const cards=()=>`<div class="grid">${flavors.map(card).join('')}</div>`;
function render(page='home'){current=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('links').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');window.scrollTo(0,0);
if(page==='home')app.innerHTML=`<section class="hero"><div class="shell hero-grid"><div><span class="eyebrow">A little love in every jar</span><h1>Homemade with Love. Rich in Every Spoonful.</h1><p>Meet Nanan's Bacon Jam — a homemade Filipino food concept inspired by family, tradition and the joy of sharing good food. We're currently perfecting our recipes.</p><div class="actions"><button class="btn" onclick="render('shop')">Explore Our Flavors</button><button class="btn alt" onclick="render('story')">Our Story</button></div></div><div class="hero-art"><img src="official-logo.jpeg" alt="Original approved Nanan's logo"></div></div></section><section class="section"><div class="shell"><div class="section-title"><span class="eyebrow">Our collection</span><h2>Four flavors. One heartfelt beginning.</h2><p>Our proposed collection is being developed and tested. Product availability and prices will be announced once confirmed.</p></div>${cards()}</div></section><section class="section cream"><div class="shell story"><div class="story-image"><img src="official-logo.jpeg" alt="Approved Nanan's logo showing the mother-inspired portrait"></div><div><span class="eyebrow">Inspired by Mom</span><h2>More than a name. A story of love.</h2><p class="muted">Nanan's is inspired by the warmth of family and the special people who make homemade food meaningful. We're building something with care, one small batch at a time.</p><button class="btn alt" onclick="render('story')">Discover Our Story</button></div></div></section><section class="section"><div class="shell"><div class="section-title"><span class="eyebrow">Phase 1</span><h2>How our trial works</h2></div><div class="steps"><div class="step"><b>01</b><h3>Perfecting the recipe</h3><p class="muted">Small batches and careful tasting.</p></div><div class="step"><b>02</b><h3>Gathering feedback</h3><p class="muted">Listening to testers and refining flavors.</p></div><div class="step"><b>03</b><h3>Preparing for launch</h3><p class="muted">Confirming food safety, pricing and fulfillment before sales.</p></div></div></div></section>`;
else if(page==='shop')app.innerHTML=header('Our Flavors','Four planned flavors. Recipes and availability are still being confirmed.')+`<section class="section"><div class="shell"><div class="notice" style="margin-bottom:25px">Recipe trial stage: no products are currently available for purchase. Prices, jar sizes and ingredients will be added only after confirmation.</div>${cards()}</div></section>`;
else if(page==='story')app.innerHTML=header('Our Story','Made with Love. Inspired by Mom.')+`<section class="section"><div class="shell story"><div class="story-image"><img src="official-logo.jpeg" alt="Official unchanged Nanan's logo"></div><div><span class="eyebrow">The heart behind Nanan's</span><h2>A brand inspired by family</h2><p class="muted">Nanan's Bacon Jam takes its name and inspiration from Mom. The brand celebrates love, homemade food and the feeling of sharing something special with people you care about.</p><p class="muted">Our story is still being written. More personal details will be added with the family's approval.</p></div></div></section>`;
else if(page==='recipes')app.innerHTML=header('Serving Inspiration','Ideas for enjoying bacon jam once the recipes are finalized.')+`<section class="section cream"><div class="shell"><div class="recipe-grid">${[['🍳','Breakfast','Try as a topping alongside your favorite breakfast dishes.'],['🍔','Sandwiches & Burgers','Explore sweet-and-savory combinations with burgers and sandwiches.'],['🍚','Rice Meals','Experiment with small portions as a savory accent to rice dishes.'],['🥨','Appetizers','Pair with suitable crackers or savory bites.'],['🥪','Snacks','Explore toast and simple snack combinations.'],['🍽️','Sharing Platters','Create small tasting boards for family gatherings.']].map(x=>`<article class="recipe"><div class="emoji">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></article>`).join('')}</div><p class="muted" style="margin-top:25px">These are serving concepts, not tested recipes. Follow verified ingredient, allergen and refrigeration guidance when products become available.</p></div></section>`;
else if(page==='contact')app.innerHTML=header('Say Hello','Questions, feedback or interest in the trial?')+`<section class="section"><div class="shell"><div class="panel"><div class="notice">Contact details and an active message service have not been configured. This form does not send messages yet.</div><form id="contactform" style="margin-top:22px"><div class="field"><label for="cname">Your name</label><input id="cname" required></div><div class="field"><label for="cemail">Email</label><input id="cemail" type="email" required></div><div class="field"><label for="cmessage">Message</label><textarea id="cmessage" rows="5" required></textarea></div><button class="btn" type="submit" disabled>Messaging coming soon</button></form></div></div></section>`;
else if(page==='cart')app.innerHTML=header('Your Bag','Ordering opens after the trial and required preparations.')+`<section class="section"><div class="shell"><div class="panel"><div class="empty">🛍️<h2>Your bag is empty</h2><p>Our recipes are in development. Please check back for confirmed products and availability.</p><button class="btn alt" onclick="render('shop')">Browse Flavors</button></div></div></div></section>`;
else render('home');}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.page)));document.getElementById('menu').addEventListener('click',()=>{const l=document.getElementById('links');l.classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(l.classList.contains('open')))});window.addEventListener('hashchange',()=>render(location.hash.replace('#','')||'home'));render(location.hash.replace('#','')||'home');
</script></body></html>
