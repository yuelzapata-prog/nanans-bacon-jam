// Display-only transparent-background treatment for the ORIGINAL approved logo.
// Reads the existing logo pixels; never modifies or replaces official-logo.jpeg.
// Only near-white pixels connected to the image's outer border become transparent.
let nanansTransparentLogo = null;
function nanansApplyLogo() {
  if (!nanansTransparentLogo) return;
  document.querySelectorAll('img[src="official-logo.jpeg"]').forEach(el => {
    el.src = nanansTransparentLogo;
  });
}
function nanansPrepareLogo() {
  const source = new Image();
  source.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = source.naturalWidth;
      canvas.height = source.naturalHeight;
      const ctx = canvas.getContext('2d', {willReadFrequently:true});
      if (!ctx) return;
      ctx.drawImage(source,0,0);
      const frame=ctx.getImageData(0,0,canvas.width,canvas.height);
      const bytes=frame.data;
      const w=canvas.width,h=canvas.height,n=w*h;
      const visited=new Uint8Array(n),queue=new Int32Array(n);
      let first=0,last=0;
      function whiteEdge(i) {
        const k=i*4,r=bytes[k],g=bytes[k+1],b=bytes[k+2];
        return r>=240&&g>=240&&b>=240&&
          Math.max(r,g,b)-Math.min(r,g,b)<20;
      }
      function add(i) {
        if (!visited[i]&&whiteEdge(i)){visited[i]=1;queue[last++]=i;}
      }
      for(let x=0;x<w;x++){add(x);add((h-1)*w+x);}
      for(let y=0;y<h;y++){add(y*w);add(y*w+w-1);}
      while(first<last){
        const p=queue[first++],x=p%w,y=(p/w)|0;
        if(x>0)add(p-1);if(x<w-1)add(p+1);
        if(y>0)add(p-w);if(y<h-1)add(p+w);
      }
      for(let i=0;i<n;i++)if(visited[i])bytes[i*4+3]=0;
      ctx.putImageData(frame,0,0);
      nanansTransparentLogo=canvas.toDataURL('image/png');
      nanansApplyLogo();
      const mount=document.getElementById('app');
      if(mount)new MutationObserver(nanansApplyLogo).observe(mount,{childList:true,subtree:true});
    }catch(error){console.warn('Keeping original logo image',error);}
  };
  source.src='official-logo.jpeg';
}
nanansPrepareLogo();
